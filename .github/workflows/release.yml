name: Release

# Builds each OS natively on its own runner (node-pty is a native module: no cross-compiling),
# then a single job attaches everything to ONE release for the tag (no race between runners).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install rpm (rpmbuild for the .rpm target)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm exec electron-vite build

      # Config comes only from electron-builder.yml. Publishing happens in the release job.
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Notas = a secao desta versao no CHANGELOG.md (## X.Y.Z ...). Sem a secao, falha em vez de publicar sem notas.
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {f=1; next} f && /^## / {exit} f' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no '## $v' section"; exit 1; fi
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      # Publica direto (sem rascunho) como Latest; o auto-update dos usuarios pega na hora.
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest*.yml
